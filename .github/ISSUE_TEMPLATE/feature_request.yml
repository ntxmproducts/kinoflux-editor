name: Feature request
description: Suggest a tool, an option or an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        KinoFlux Editor is a batch toolbox that works fully offline, so ideas that need an account, a server or a network connection will not fit. Everything else is welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Video
        - Audio
        - Image
        - PDF
        - Documents
        - Interface or workflow
        - Installer or platforms
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the job you need to get done.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
